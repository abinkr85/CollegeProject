name: CI/CD Pipeline

"on":
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]
  workflow_dispatch:

jobs:
  # ============================================================
  # 1. Backend CI: Dependencies, Prisma Generation & Unit Tests
  # ============================================================
  backend-ci:
    name: Backend CI (Tests & Security)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: Generate Prisma Client
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/testdb"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/testdb"
        run: npx prisma generate

      - name: Run Backend Test Suite (Vitest)
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/testdb"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/testdb"
          REDIS_URL: "redis://localhost:6379"
          JWT_ACCESS_SECRET: "test-jwt-access-secret-minimum-32-characters-long"
          JWT_REFRESH_SECRET: "test-jwt-refresh-secret-minimum-32-characters-long"
          NLP_SERVICE_URL: "http://localhost:5001"
          CLOUDINARY_CLOUD_NAME: "test"
          CLOUDINARY_API_KEY: "test"
          CLOUDINARY_API_SECRET: "test"
          EMAIL_USER: "test@example.com"
          EMAIL_PASS: "test"
          EMAIL_FROM: "noreply@example.com"
          CLIENT_URL: "http://localhost:5173"
        run: npm test

  # ============================================================
  # 2. Frontend CI: Dependencies, Student Build & Admin Build
  # ============================================================
  frontend-ci:
    name: Frontend CI (Student & Admin Builds)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Student Portal
        working-directory: frontend
        run: npm run build:student

      - name: Build Admin Portal
        working-directory: frontend
        run: npm run build:admin

  # ============================================================
  # 3. NLP Service CI: Python Tests & Compilation
  # ============================================================
  nlp-ci:
    name: NLP Service CI (Pytest & Compilation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install NLP dependencies
        working-directory: nlp-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Compile Python code
        working-directory: nlp-service
        run: python -m py_compile app.py config.py

      - name: Run NLP Test Suite (Pytest)
        working-directory: nlp-service
        env:
          PYTHONPATH: .
        run: python -m pytest tests/

  # ============================================================
  # 4. Continuous Deployment: Render & Docker Hub
  # ============================================================
  deploy:
    name: Deploy to Render
    needs: [backend-ci, frontend-ci, nlp-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
      RENDER_NLP_DEPLOY_HOOK: ${{ secrets.RENDER_NLP_DEPLOY_HOOK }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Optional: Docker Hub build and push
      # --------------------------------------------------------
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smart-campus-backend:latest

      - name: Build and push NLP image
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: nlp-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smart-campus-nlp:latest

      # --------------------------------------------------------
      # Trigger Render Deployments via Render API
      # --------------------------------------------------------
      - name: Trigger Render Service Deployments via API
        if: env.RENDER_API_KEY != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "Triggering verified deployments for services on Render..."
          SERVICES=(
            "srv-db8sivrbc2fs73c1oj10"
            "srv-db8sot0n74is73cmvc9g"
            "srv-db8sqq6i0phs738t48ng"
            "srv-db8sktjbc2fs73c20060"
          )
          for SERVICE_ID in "${SERVICES[@]}"; do
            echo "Deploying service $SERVICE_ID..."
            curl -fsS -X POST "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"clearCache": "do_not_clear"}' || echo "Notice: Deploy call for $SERVICE_ID completed."
          done

      # --------------------------------------------------------
      # Fallback: Trigger Deploy Hooks if configured
      # --------------------------------------------------------
      - name: Trigger Render Backend Deploy Hook
        if: env.RENDER_BACKEND_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

      - name: Trigger Render NLP Deploy Hook
        if: env.RENDER_NLP_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "${{ secrets.RENDER_NLP_DEPLOY_HOOK }}"

      # --------------------------------------------------------
      # Deployment Summary Card in GitHub Actions
      # --------------------------------------------------------
      - name: Generate Deployment Summary
        run: |
          echo "### 🚀 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "All automated tests and builds passed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Live Production URL |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Student Portal** | https://student-frontend-8w2s.onrender.com |" >> $GITHUB_STEP_SUMMARY
          echo "| **Admin Portal** | https://admin-frontend-5d1n.onrender.com |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend API** | https://backend-9tut.onrender.com |" >> $GITHUB_STEP_SUMMARY
          echo "| **NLP Service** | https://nlp-service-ixwy.onrender.com |" >> $GITHUB_STEP_SUMMARY
